name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vijaythecoder/awesome-claude-agents
          ref: 2050f3c60fcfea497f7b6b3ec6566cc316367a7e
          path: awesome-claude-agents
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/generate.py --release --check
      - run: python scripts/verify_upstream.py --source-root awesome-claude-agents
      - run: python scripts/validate.py --development
      - run: python -m pytest -q
